<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="625" viewBox="0 0 1000 625" role="img" aria-labelledby="title desc"><title id="title">Satellite imagery increased prediction error</title><desc id="desc">Baseline MAPE 13.15 percent. With imagery 13.73 percent. Lower is better. 1,621 test rows.</desc><rect width="1000" height="625" fill="#1e2421"/><g fill="#f7f8f6" font-family="Arial,sans-serif"><text x="60" y="75" font-size="20">TAIWAN HOUSE PRICES / MODEL EVALUATION</text><text x="60" y="160" font-size="58" letter-spacing="-2">More data. Worse prediction.</text><text x="60" y="235" font-size="23">Without imagery</text><text x="900" y="235" font-size="28" text-anchor="end">13.15%</text><rect x="60" y="260" width="789" height="55" fill="#f7f8f6"/><text x="60" y="375" font-size="23">With imagery</text><text x="900" y="375" font-size="28" text-anchor="end">13.73%</text><rect x="60" y="400" width="824" height="55" fill="#f7f8f6"/><path d="M60 480H900" stroke="#f7f8f6" stroke-opacity=".5"/><text x="60" y="510" font-size="16">0</text><text x="480" y="510" font-size="16" text-anchor="middle">7</text><text x="900" y="510" font-size="16" text-anchor="end">14% MAPE</text><text x="60" y="575" font-size="18">Lower is better. 1,621 test rows. p = 0.0016.</text></g></svg>
